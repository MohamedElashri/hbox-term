[package]
name = "hbox-term"
version = "0.1.0"
description = "hbox-term: a fast local and remote terminal workspace with agentless Linux server management over SSH."
authors = ["Mohamed Elashri <git@elashri.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "hbox_term_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
walkdir = "2"
cron = "0.15"
portable-pty = "0.9.0"
tauri-plugin-clipboard-manager = "2"
notify = "8"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
