name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create or reuse GitHub release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_draft: ${{ steps.release.outputs.release_draft }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check version, changelog and signing key
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for found in \
            "$(jq -r .version src-tauri/tauri.conf.json)" \
            "$(jq -r .version package.json)" \
            "$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"; do
            if [[ "$found" != "$version" ]]; then
              echo "Tag $RELEASE_TAG does not match version $found in the manifests." >&2
              exit 1
            fi
          done
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Set the TAURI_SIGNING_PRIVATE_KEY secret (see DEVELOPER_GUIDE.md)." >&2
            exit 1
          fi
          # The release notes are the changelog section for this version.
          awk -v heading="## $version" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no entry for $version." >&2
            exit 1
          fi

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" != v* || "$RELEASE_TAG" == */* || "$RELEASE_TAG" == *[!a-zA-Z0-9._-]* ]]; then
            echo "RELEASE_TAG must start with v and contain only letters, numbers, dots, underscores, or hyphens." >&2
            exit 1
          fi

          releases_endpoint="repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          release_json="$(gh api "$releases_endpoint" | jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)][0]')"
          if [[ "$release_json" != "null" ]]; then
            echo "Reusing existing release for ${RELEASE_TAG}."
          else
            echo "Creating draft release for ${RELEASE_TAG}."
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "hbox-term ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --draft

            # Newly created draft releases can take a few seconds to appear in
            # the releases list. The by-tag endpoint cannot retrieve drafts.
            for attempt in {1..10}; do
              release_json="$(gh api "$releases_endpoint" | jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)][0]')"
              [[ "$release_json" != "null" ]] && break
              echo "Waiting for GitHub to return the new draft release (attempt ${attempt}/10)."
              sleep 3
            done
          fi

          if [[ "$release_json" == "null" ]]; then
            echo "Could not find the GitHub release for ${RELEASE_TAG} after creating it." >&2
            exit 1
          fi

          {
            echo "release_id=$(jq -r '.id' <<<"$release_json")"
            echo "release_draft=$(jq -r '.draft' <<<"$release_json")"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted runners build natively for each architecture.
          - name: macOS Intel (x86_64)
            runner: macos-15-intel
            os: macos
            rust_target: x86_64-apple-darwin
          - name: macOS Apple Silicon (ARM64)
            runner: macos-14
            os: macos
            rust_target: aarch64-apple-darwin
          - name: Linux Intel (x86_64)
            runner: ubuntu-22.04
            os: linux
            rust_target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            os: linux
            rust_target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the updater artifacts (.AppImage, .deb, .rpm, .app.tar.gz) for in-app updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc signing avoids Apple Silicon apps being reported as damaged.
          # It is not notarization; users may still need to approve the app in Privacy & Security.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && '-' || '' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: ${{ needs.create-release.outputs.release_draft }}
          releaseAssetNamePattern: "hbox-term-v[version]-[platform]-[arch]-[bundle][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: --target ${{ matrix.rust_target }}

  publish-release:
    name: Publish release
    needs: [create-release, build]
    if: needs.create-release.outputs.release_draft == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The in-app updater reads latest.json from the latest release.
      - name: Add latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          rm -f assets/latest.json assets/SHA256SUMS.txt
          node tools/update-manifest.mjs assets release.json assets/latest.json
          gh release upload "$RELEASE_TAG" assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber

      # install.sh verifies downloads against this file.
      - name: Add SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt && cat ../SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f draft=false
