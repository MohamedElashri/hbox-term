name: Native Linux GUI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gui:
    name: Native GUI (${{ matrix.display }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        display: [x11, wayland]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native display and WebKit dependencies
        timeout-minutes: 10
        uses: ./.github/actions/linux-dependencies
        with:
          packages: build-essential openssh-client libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xauth weston dbus-x11
      - run: npm ci
      - name: Build isolated native test application
        run: npm run tauri -- build --debug --no-bundle --config '{"productName":"Ternway CI","identifier":"dev.elashri.ternway.ci","bundle":{"createUpdaterArtifacts":false}}'
      - name: Install pinned native WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Exercise native WebKitGTK
        timeout-minutes: 8
        env:
          DISPLAY_BACKEND: ${{ matrix.display }}
          TERNWAY_GUI_ROOT: ${{ runner.temp }}/ternway-gui-${{ matrix.display }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          set -euo pipefail
          if [[ "$DISPLAY_BACKEND" == x11 ]]; then
            export GDK_BACKEND=x11
            xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- python3 tools/native-gui-smoke.py src-tauri/target/debug/ternway
          else
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/ternway-wayland-runtime"
            mkdir -m 700 "$XDG_RUNTIME_DIR"
            export WAYLAND_DISPLAY=wayland-ternway
            export GDK_BACKEND=wayland
            unset DISPLAY
            weston --backend=headless-backend.so --renderer=pixman --socket="$WAYLAND_DISPLAY" --idle-time=0 --width=1440 --height=900 --no-config > "$RUNNER_TEMP/weston.log" 2>&1 &
            compositor_pid=$!
            trap 'kill "$compositor_pid" || true' EXIT
            for attempt in $(seq 1 100); do
              [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
              sleep 0.1
            done
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            dbus-run-session -- python3 tools/native-gui-smoke.py src-tauri/target/debug/ternway
          fi
      - name: Upload native QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-gui-${{ matrix.display }}
          path: |
            ${{ runner.temp }}/ternway-gui-${{ matrix.display }}/artifacts
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
