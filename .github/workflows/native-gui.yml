name: Native Linux GUI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gui:
    name: Native GUI (X11 and Wayland)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native display and WebKit dependencies
        timeout-minutes: 10
        uses: ./.github/actions/linux-dependencies
        with:
          packages: build-essential openssh-client libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xauth weston dbus-x11
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install disposable SSH fixture
        run: python -m pip install -r tests/fixtures/requirements.txt
      - name: Build isolated native test application
        run: npm run tauri -- build --debug --no-bundle --config '{"productName":"Ternway CI","identifier":"dev.elashri.ternway.ci","bundle":{"createUpdaterArtifacts":false}}'
      - name: Install pinned native WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked
      # Reuse one compiled binary and dependency installation for both displays.
      - name: Exercise native X11 WebKitGTK
        timeout-minutes: 8
        env:
          TERNWAY_GUI_ROOT: ${{ runner.temp }}/ternway-gui-x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: bash tools/run-native-gui.sh x11
      - name: Exercise native Wayland WebKitGTK
        timeout-minutes: 8
        env:
          TERNWAY_GUI_ROOT: ${{ runner.temp }}/ternway-gui-wayland
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: bash tools/run-native-gui.sh wayland
      - name: Upload native QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-gui-x11-and-wayland
          path: |
            ${{ runner.temp }}/ternway-gui-x11/artifacts
            ${{ runner.temp }}/ternway-gui-wayland/artifacts
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
