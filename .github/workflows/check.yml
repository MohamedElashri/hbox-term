name: Check macOS and Linux
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openssh-client libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install loopback SSH fixture
        run: python -m pip install -r tests/fixtures/requirements.txt
      - name: Test password login over SSH
        run: make test-ssh-password
        env:
          TERNWAY_SSH_TEST_PYTHON: python
