name: Check macOS and Linux
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential openssh-client libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Soak terminal lifecycle and output
        timeout-minutes: 5
        run: make test-soak
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install loopback SSH fixture
        run: python -m pip install -r tests/fixtures/requirements.txt
      - name: Test password login over SSH
        run: make test-ssh-password
        env:
          TERNWAY_SSH_TEST_PYTHON: python
      - name: Test native OpenSSH compatibility
        run: make test-openssh
        env:
          TERNWAY_SSH_TEST_PYTHON: python
